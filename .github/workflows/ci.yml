name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  docker:
    name: docker image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: genepath-runner:ci

      - name: start container
        run: |
          docker run -d --name genepath-ci -p 8080:8080 genepath-runner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 1
          done

      - name: smoke test
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ |
            grep -q "GenePath Runner"
          curl -fsS http://127.0.0.1:8080/api/v1/meta | head -c 200
          echo
          curl -fsS http://127.0.0.1:8080/api/v1/dashboard
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/runs/run_missing)" = "404"

      - name: container logs
        if: always()
        run: docker logs genepath-ci

      - name: stop container
        if: always()
        run: docker rm -f genepath-ci
